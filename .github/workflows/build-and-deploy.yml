name: Build Verified Offline Android APK (Cardio + Respiratory + Digestive + Cor HD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached Z-Anatomy + Cor HD + Encephalon HD models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: public/models
          key: z-anatomy-glb-v8-viscera-corhd-${{ hashFiles('scripts/export_z_anatomy.py') }}

      - name: Install Blender (Headless)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy unzip git curl

      - name: Export Z-Anatomy split layers + Cor HD (Dundee CAHID) + Encephalon HD
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets_source public/models
          git clone --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy.git assets_source/repo
          unzip -q assets_source/repo/Z-Anatomy.zip -d assets_source/extracted
          BLEND_FILE=$(find assets_source/extracted -name "*.blend" | head -n 1)
          cp assets_source/repo/TA2.csv assets_source/TA2.csv
          blender -b "$BLEND_FILE" --python-exit-code 1 -P scripts/export_z_anatomy.py -- --ta2 assets_source/TA2.csv --out public/models

          # High-Detail Interior Heart (University of Dundee CAHID via karansuraj/pvc-heart-tool)
          if git clone --depth 1 https://github.com/karansuraj/pvc-heart-tool.git assets_source/heart_hd; then
            HEART_GLB=$(find assets_source/heart_hd -name "*.glb" | head -n 1)
            if [ -n "$HEART_GLB" ] && [ -f "$HEART_GLB" ]; then
              cp "$HEART_GLB" public/models/cor_hd.glb
              python3 - << 'PY'
          import json, os
          p = "public/models/manifest.json"
          m = json.load(open(p, encoding="utf-8"))
          sz = round(os.path.getsize("public/models/cor_hd.glb") / (1024 * 1024), 2)
          m["systems"].insert(0, {
            "id": "cor_hd",
            "name": "Cor HD — Interior (Dundee CAHID)",
            "tr": "Yüksek Detaylı İç Kalp & Kapakçıklar",
            "color": "#b91c1c",
            "defaultVisible": False,
            "defaultOpacity": 1.0,
            "standalone": True,
            "file": "models/cor_hd.glb",
            "meshCount": 1,
            "sizeMB": sz
          })
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False)
          print("Added Cor HD Interior Heart module:", sz, "MB")
          PY
            fi
          fi

          # High-Detail Neuroanatomy (itayinbarr/brainproject)
          if git clone --depth 1 https://github.com/itayinbarr/brainproject.git assets_source/brainproject; then
            BRAIN_GLB=$(find assets_source/brainproject -name "brain.glb" | head -n 1)
            if [ -n "$BRAIN_GLB" ] && [ -f "$BRAIN_GLB" ]; then
              cp "$BRAIN_GLB" public/models/encephalon_hd.glb
              python3 - << 'PY'
          import json, os
          p = "public/models/manifest.json"
          m = json.load(open(p, encoding="utf-8"))
          sz = round(os.path.getsize("public/models/encephalon_hd.glb") / (1024 * 1024), 2)
          m["systems"].append({
            "id": "encephalon_hd",
            "name": "Encephalon HD (Neuroanatomia)",
            "tr": "Yüksek Detaylı Beyin & Çekirdekler",
            "color": "#e2b8ac",
            "defaultVisible": False,
            "defaultOpacity": 1.0,
            "standalone": True,
            "file": "models/encephalon_hd.glb",
            "meshCount": 250,
            "sizeMB": sz
          })
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False)
          print("Added Encephalon HD module:", sz, "MB")
          PY
            fi
          fi
          ls -lh public/models

      - name: Verify split cardio/respiratory/digestive export integrity
        run: |
          python3 - << 'PY'
          import json
          m = json.load(open("public/models/manifest.json", encoding="utf-8"))
          l = json.load(open("public/models/landmarks.json", encoding="utf-8"))
          sys_ids = {s["id"]: s["meshCount"] for s in m["systems"]}
          assert m["totalStructures"] >= 2000, f"Yetersiz yapi: {m['totalStructures']}"
          assert len(l) >= 500, f"Yetersiz landmark: {len(l)}"
          for req in ("arteriae", "venae", "respiratory", "digestive"):
              assert req in sys_ids and sys_ids[req] > 0, f"Eksik sistem katmani: {req}"
          print("VERIFIED LAYERS:", sys_ids, "Landmarks:", len(l))
          PY

      - name: Upload models artifact for build jobs
        uses: actions/upload-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models
          retention-days: 1

  build-web:
    needs: prepare-models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 3x automated feature verification tests
        run: node tests/verify_all.mjs

      - name: Install dependencies & bundle offline Draco JS decoder
        run: |
          npm install
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/gltf/* public/draco/

      - name: Download exported models
        uses: actions/download-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models

      - name: Build Vite bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Initialize Capacitor Android & build offline APK
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to release folder
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Anatomi3D-Atlas.apk
          ls -lh release-apk/Anatomi3D-Atlas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anatomi3D-Atlas-APK
          path: release-apk/Anatomi3D-Atlas.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Atlas Anatomicus 3D (Cor HD + Respiratorium + Digestorium APK)
          files: release-apk/Anatomi3D-Atlas.apk
          make_latest: true
