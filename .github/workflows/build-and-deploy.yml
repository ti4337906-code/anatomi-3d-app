name: Build Web (GitHub Pages) & Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached Z-Anatomy GLB models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: public/models
          key: z-anatomy-glb-v4-landmarks-${{ hashFiles('scripts/export_z_anatomy.py') }}

      - name: Install Blender (Headless)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy unzip git

      - name: Download Z-Anatomy official dataset & export GLB layers
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets_source public/models
          git clone --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy.git assets_source/repo
          unzip -q assets_source/repo/Z-Anatomy.zip -d assets_source/extracted
          BLEND_FILE=$(find assets_source/extracted -name "*.blend" | head -n 1)
          cp assets_source/repo/TA2.csv assets_source/TA2.csv
          blender -b "$BLEND_FILE" --python-exit-code 1 -P scripts/export_z_anatomy.py -- --ta2 assets_source/TA2.csv --out public/models
          test -f public/models/manifest.json
          ls -lh public/models

      - name: Upload models artifact for build jobs
        uses: actions/upload-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models
          retention-days: 1

  build-web:
    needs: prepare-models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & bundle offline Draco decoder
        run: |
          npm install
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/gltf/* public/draco/

      - name: Download exported Z-Anatomy models
        uses: actions/download-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models

      - name: Build Vite bundle (Pages + APK shared dist)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Initialize Capacitor Android & build offline APK
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to release folder
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Anatomi3D-Atlas.apk
          ls -lh release-apk/Anatomi3D-Atlas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anatomi3D-Atlas-APK
          path: release-apk/Anatomi3D-Atlas.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Anatomi 3D Atlas (Tam Çevrimdışı APK)
          files: release-apk/Anatomi3D-Atlas.apk
          make_latest: true
