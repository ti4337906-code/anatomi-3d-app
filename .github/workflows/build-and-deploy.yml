name: Build Multi-Source CT/MRI Offline Android APK (NIH HRA + CAHID + Brain + Z-Anatomy)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached Multi-Source CT/MRI + Z-Anatomy models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: public/models
          key: multi-ct-mri-v11-${{ hashFiles('scripts/export_z_anatomy.py', 'scripts/assemble_hybrid_ct.py', 'custom_models/**') }}

      - name: Install Blender (Headless)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy unzip git curl

      - name: Export Z-Anatomy & fetch all CT/MRI open-source datasets
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets_source public/models

          # 1. Z-Anatomy (full dissectible body + surface-snapped osteology pins)
          git clone --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy.git assets_source/repo
          unzip -q assets_source/repo/Z-Anatomy.zip -d assets_source/extracted
          BLEND_FILE=$(find assets_source/extracted -name "*.blend" | head -n 1)
          cp assets_source/repo/TA2.csv assets_source/TA2.csv
          blender -b "$BLEND_FILE" --python-exit-code 1 -P scripts/export_z_anatomy.py -- --ta2 assets_source/TA2.csv --out public/models

          # 2. NIH HuBMAP HRA (Visible Human Project — 1mm CT & 0.33mm Cryo-section GLB organs)
          git clone --depth 1 https://github.com/hubmapconsortium/ccf-3d-reference-object-library.git assets_source/hubmap_hra || true

          # 3. Dundee CAHID Interior Heart (BT/MR)
          git clone --depth 1 https://github.com/karansuraj/pvc-heart-tool.git assets_source/heart_hd || true

          # 4. Brainproject Neuroanatomy (MR + MNI Atlas)
          git clone --depth 1 https://github.com/itayinbarr/brainproject.git assets_source/brainproject || true

          # 5. Dental Scope (Craniofacial Jaws, Sinuses & Trigeminal)
          git clone --depth 1 https://github.com/Yoosseph/dental-scope.git assets_source/dental_scope || true

          # Assemble all CT/MRI + custom_models/*.glb into manifest.json
          python3 scripts/assemble_hybrid_ct.py
          ls -lh public/models

      - name: Verify multi-source anatomical integrity
        run: |
          python3 - << 'PY'
          import json
          m = json.load(open("public/models/manifest.json", encoding="utf-8"))
          sys_ids = {s["id"]: s["meshCount"] for s in m["systems"]}
          assert m["totalStructures"] >= 2000, f"Yetersiz yapi: {m['totalStructures']}"
          for req in ("cor_detail", "arteriae", "venae", "respiratory", "digestive"):
              assert req in sys_ids and sys_ids[req] > 0, f"Eksik sistem katmani: {req}"
          print("VERIFIED ALL MODULES:", list(sys_ids.keys()), "Total Z-Anatomy:", m["totalStructures"], "SnappedPins:", m.get("snappedPins", 0))
          PY

      - name: Upload models artifact for build jobs
        uses: actions/upload-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models
          retention-days: 1

  build-web:
    needs: prepare-models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 3x automated feature verification tests
        run: node tests/verify_all.mjs

      - name: Install dependencies & bundle offline Draco JS decoder
        run: |
          npm install
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/gltf/* public/draco/

      - name: Download exported models
        uses: actions/download-artifact@v4
        with:
          name: z-anatomy-models
          path: public/models

      - name: Build Vite bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Initialize Capacitor Android & build offline APK
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to release folder
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Anatomi3D-Atlas.apk
          ls -lh release-apk/Anatomi3D-Atlas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anatomi3D-Atlas-APK
          path: release-apk/Anatomi3D-Atlas.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Atlas Anatomicus 3D (Çoklu BT/MR Harmanlanmış APK)
          files: release-apk/Anatomi3D-Atlas.apk
          make_latest: true
