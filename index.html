<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Anatomi 3D Atlas — Z-Anatomy</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="viewport"></div>

  <!-- Minimal Ust Baslik -->
  <header class="hud-top">
    <div class="brand-chip">
      <span class="neon-dot"></span>
      <span>ANATOMİ 3D</span>
    </div>
    <div id="statusChip" class="status-chip">Yükleniyor...</div>
    <button id="btnReset" class="hud-mini-btn">Sıfırla</button>
  </header>

  <!-- Secili Yapi Kisa Bandi (Ustte tek satir, hemen kapatilabilir) -->
  <div id="selectedPill" class="selected-pill hidden">
    <div class="sel-text" id="btnOpenDetailFromPill">
      <strong id="pillName">-</strong>
      <small id="pillLatin">-</small>
    </div>
    <button id="btnPillHide" class="pill-action">Gizle</button>
    <button id="btnPillIsolate" class="pill-action">İzole</button>
    <button id="btnPillClose" class="pill-close">✕</button>
  </div>

  <!-- Hata / Bilgi Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Tek Alt Cekmece (Bottom Sheet - Her zaman tek acik, kesin kapanir) -->
  <section id="sheet" class="sheet hidden">
    <div class="sheet-header">
      <h3 id="sheetTitle">Menü</h3>
      <button id="btnCloseSheet" class="sheet-close">✕ Kapat</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <!-- Alt Ana Navigasyon -->
  <nav class="bottom-nav">
    <button data-sheet="systems" class="nav-btn">Sistemler</button>
    <button data-sheet="search" class="nav-btn">Ara</button>
    <button data-sheet="camera" class="nav-btn">Kamera</button>
    <button data-sheet="slice" class="nav-btn">Kesit</button>
    <button id="btnXray" class="nav-btn">Röntgen</button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
