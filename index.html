<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Atlas Anatomicus 3D — Terminologia Anatomica (TA2)</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="viewport"></div>
  <div id="pinsLayer" class="pins-layer"></div>

  <header class="hud-top">
    <div class="brand-chip">Atlas 3D • TA2</div>
    <button id="btnColorMode" class="hud-mini-btn" title="Doğal / Atlas Renklendirme Modu">Renk: Doğal</button>
    <button id="btnReset" class="hud-mini-btn">Sıfırla</button>
  </header>

  <div id="statusBar" class="status-bar">Yükleniyor...</div>

  <div id="selectedPill" class="selected-pill hidden">
    <div class="sel-text" id="btnOpenDetailFromPill">
      <strong id="pillLatin">-</strong>
      <small id="pillSub">-</small>
    </div>
    <button id="btnPillFade" class="pill-action">Fade</button>
    <button id="btnPillHide" class="pill-action">Gizle</button>
    <button id="btnPillIsolate" class="pill-action">İzole</button>
    <button id="btnPillClose" class="pill-close">✕</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <section id="sheet" class="sheet hidden">
    <div class="sheet-header">
      <h3 id="sheetTitle">Menü</h3>
      <button id="btnCloseSheet" class="sheet-close">✕ Kapat</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <nav class="bottom-nav">
    <button data-sheet="systems" class="nav-btn">Systemata</button>
    <button data-sheet="search" class="nav-btn">Ara (TA2)</button>
    <button data-sheet="camera" class="nav-btn">Kamera</button>
    <button data-sheet="slice" class="nav-btn">Kesit</button>
    <button id="btnPins" class="nav-btn">Pinler</button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
